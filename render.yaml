# Render blueprint for the Relay backend + database.
# One-click deploy: Render dashboard → New + → Blueprint → pick this repo → Apply.
# `fromDatabase` and `generateValue` are filled in by Render at deploy time, so no
# secrets live in the repo. The frontend deploys separately on Vercel (see web/vercel.json).
databases:
  - name: relay-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: relay-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn relay.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: RELAY_ENVIRONMENT
        value: production
      - key: RELAY_DATABASE_URL
        fromDatabase:
          name: relay-db
          property: connectionString
      - key: RELAY_SECRET_KEY
        generateValue: true
      - key: RELAY_RATE_LIMIT_PER_MINUTE
        value: "1000"
      - key: PYTHON_VERSION
        value: "3.11.9"
