[project]
name = "relay"
version = "0.0.0"
description = "Relay — a responsibility-transfer engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.30,<0.35",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "email-validator>=2.1,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "structlog>=24.1,<25",
    "httpx>=0.27,<0.29",
    "argon2-cffi>=23.1,<24",
    "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.100,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "import-linter>=2.0,<3",
    "types-python-dateutil",
    "aiosmtpd>=1.4,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: touches a real Postgres database",
    "property: hypothesis property-based test",
    "concurrency: exercises concurrent DB transactions",
    "security: authn/authz and tenant-isolation tests",
    "worker: durable worker / scheduler / recurrence tests",
    "e2e: full-stack end-to-end flow through the API",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
packages = ["relay"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["relay"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "relay_core is framework- and AI-free"
type = "forbidden"
source_modules = ["relay.core"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "relay.ai",
    "relay.api",
    "relay.notifications",
    "relay.worker",
]

[[tool.importlinter.contracts]]
name = "relay_ai never touches ownership domain or the web layer"
type = "forbidden"
source_modules = ["relay.ai"]
forbidden_modules = ["fastapi", "starlette", "relay.api", "relay.worker"]
